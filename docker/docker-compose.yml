name: guestportal

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: guestportal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: guestportal
      POSTGRES_USER: guestportal
      POSTGRES_PASSWORD: guestportal
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U guestportal -d guestportal']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: guestportal-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: guestportal-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: guestportal
      MINIO_ROOT_PASSWORD: guestportal_secret
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: guestportal-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 guestportal guestportal_secret &&
      mc mb --ignore-existing local/guest-platform-dev &&
      exit 0
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
